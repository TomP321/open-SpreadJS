-->

    <title>OpenSheets savePDF oracle</title>

    <style>
      body { margin: 0; font: 13px system-ui, sans-serif; background: #f5f5f5; }
      #status { padding: 8px 12px; }
      canvas { position: absolute; left: -10000px; top: 0; }
    </style>
  </head>
  <body>

    <script type="module" src="/src/pdf-oracle.ts"></script>
