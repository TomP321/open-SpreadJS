<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Charts comparison (official vs ours)</title></head><body>
<div id="hosts" style="position:relative;width:1100px"></div>
<script type="module">
import Official from '@mescius/spread-sheets';
import '@mescius/spread-sheets/styles/gc.spread.sheets.excel2013white.css';
import OpenSheets from '@opensheets/spread-sheets';
import '@opensheets/spread-sheets/styles/gc.spread.sheets.css';
import shapesUrl from '../../node_modules/.pnpm/@mescius+spread-sheets-shapes@19.2.5/node_modules/@mescius/spread-sheets-shapes/dist/gc.spread.sheets.shapes.min.js?url';
import chartsUrl from '../../node_modules/.pnpm/@mescius+spread-sheets-charts@19.2.5/node_modules/@mescius/spread-sheets-charts/dist/gc.spread.sheets.charts.min.js?url';
window.GC = Official;
const fixFs = src => typeof src === 'string' ? src.replace(/^\/@fs(?=\/@fs\/)/, '') : src;
const loadScript = src => new Promise((resolve, reject) => {
  const el = document.createElement('script');
  el.src = src;
  el.onload = resolve;
  el.onerror = () => reject(new Error('failed to load ' + src));
  document.head.append(el);
});
// The official chart runtime ships as a UMD plugin on top of the core + shapes.
await loadScript(fixFs(shapesUrl));
await loadScript(fixFs(chartsUrl));

const LIBS = { official: Official, ours: OpenSheets };
window.__LIBS__ = LIBS;
const sessions = {};

// Fixture: A1 blank, B1:D1 series names, A2:A4 categories, B2:D4 values.
const FIXTURE = [
  ['', 'Q1', 'Q2', 'Q3'],
  ['Apples', 5, 8, 3],
  ['Oranges', 4, 6, 7],
  ['Pears', 7, 2, 5],
];
// OHLC fixture for the stock families (column A = label, B..E = price series,
// four data rows so the 4-series stock variants get enough series).
const FIXTURE_STOCK = [
  ['', 'Open', 'High', 'Low', 'Close', 'Volume'],
  ['Jan', 2, 8, 1, 6, 40],
  ['Feb', 4, 9, 3, 5, 50],
  ['Mar', 3, 7, 2, 4, 30],
  ['Apr', 5, 8, 3, 7, 45],
];
const FIXTURES = { default: FIXTURE, stock: FIXTURE_STOCK };
const DEFAULT_RANGE = 'A1:D4';
const CHART = { x: 200, y: 10, width: 420, height: 280 };

function strip(value) {
  const walk = any => {
    if (Array.isArray(any)) return any.map(walk);
    if (any && typeof any === 'object') {
      const out = {};
      for (const key of Object.keys(any)) {
        const item = any[key];
        if (typeof item === 'function') continue;
        if (typeof item === 'string' && /^data:image/.test(item)) { out[key] = '<png:' + item.length + '>'; continue; }
        out[key] = walk(item);
      }
      return out;
    }
    return any;
  };
  return walk(JSON.parse(JSON.stringify(value)));
}

/** Resolve {__e:'ChartType.pie'} markers (at any depth) against the session's GC. */
function resolveArgs(GC, value) {
  if (Array.isArray(value)) return value.map(v => resolveArgs(GC, v));
  if (value && typeof value === 'object') {
    if (typeof value.__e === 'string') {
      return value.__e.split('.').reduce((o, k) => (o == null ? undefined : o[k]), GC.Spread.Sheets.Charts);
    }
    const out = {};
    for (const [k, v] of Object.entries(value)) out[k] = resolveArgs(GC, v);
    return out;
  }
  return value;
}

function resolveTarget(s, path) {
  const dot = path.lastIndexOf('.');
  const targetName = dot < 0 ? path : path.slice(0, dot);
  const member = dot < 0 ? null : path.slice(dot + 1);
  const named = {
    chart: () => s.chart,
    series: () => s.chart.series(),
    sheet: () => s.sheet,
    wb: () => s.wb,
    charts: () => s.sheet.charts,
  };
  const target = (named[targetName] ?? (() => undefined))();
  if (!target) throw new Error('unknown op target ' + path);
  return { target, member };
}

/** Generic operation runner: ops are [target.member, argsArray] pairs. */
function apply(kind, ops) {
  const s = sessions[kind];
  const log = [];
  for (const [path, rawArgs] of ops) {
    const args = resolveArgs(s.GC, rawArgs ?? []);
    const { target, member } = resolveTarget(s, path);
    if (!member) throw new Error('unknown op ' + path);
    if (typeof target[member] !== 'function') { log.push(path + ':missing'); continue; }
    try {
      const ret = target[member](...args);
      const shown = ret === undefined ? 'undefined' : ret === target || ret === s.chart ? '<chart>' : JSON.stringify(strip(ret));
      log.push(path + ':' + String(shown).slice(0, 300));
    }
    catch (error) { log.push(path + ':throws:' + String(error.message).slice(0, 120)); }
  }
  return log;
}

function chartState(s) {
  const out = { hasChart: !!s.chart };
  if (!s.chart) return out;
  const call = (label, fn) => { try { out[label] = strip(fn()); } catch (error) { out[label] = { throws: String(error.message).slice(0, 140) }; } };
  call('chartJson', () => s.chart.toJSON());
  call('chartType', () => s.chart.chartType());
  call('dataRange', () => s.chart.dataRange());
  call('title', () => s.chart.title());
  call('legend', () => s.chart.legend());
  call('axes', () => s.chart.axes());
  call('chartArea', () => s.chart.chartArea());
  call('plotArea', () => s.chart.plotArea());
  call('dataLabels', () => s.chart.dataLabels());
  call('colorScheme', () => s.chart.colorScheme());
  call('ignoreHidden', () => s.chart.ignoreHidden());
  call('displayBlanksAs', () => s.chart.displayBlanksAs());
  call('useAnimation', () => s.chart.useAnimation());
  call('displayNaAsBlank', () => s.chart.displayNaAsBlank());
  call('geometry', () => [s.chart.x(), s.chart.y(), s.chart.width(), s.chart.height()]);
  call('anchor', () => [s.chart.startRow(), s.chart.startColumn(), s.chart.endRow(), s.chart.endColumn()]);
  call('getHostThrows', () => { try { s.chart.getHost(); return false; } catch { return true; } });
  call('seriesList', () => {
    const sc = s.chart.series();
    const items = [];
    if (typeof sc.get === 'function') {
      const first = sc.get();
      if (Array.isArray(first)) return strip(first);
      if (first !== undefined && first !== null) items.push(first);
      for (let i = 0; i < 12; i++) {
        const one = sc.get(i);
        if (one === undefined || one === null) break;
        items.push(one);
      }
    }
    return strip(items);
  });
  call('seriesGetThrows', () => { try { return String(s.chart.series().get(99)); } catch (error) { return 'throws'; } });
  call('formula', () => ({
    name: s.chart.getFormula ? safeGetFormula(s, 'name') : null,
    data: s.chart.getFormula ? safeGetFormula(s, 'data') : null,
    title: s.chart.getFormula ? safeGetFormula(s, 'title') : null,
    'series[0].name': s.chart.getFormula ? safeGetFormula(s, 'series[0].name') : null,
    'series[0].value': s.chart.getFormula ? safeGetFormula(s, 'series[0].value') : null,
    'series[0].xValue': s.chart.getFormula ? safeGetFormula(s, 'series[0].xValue') : null,
    'series[0].category': s.chart.getFormula ? safeGetFormula(s, 'series[0].category') : null,
    'axes.primaryValue.title': s.chart.getFormula ? safeGetFormula(s, 'axes.primaryValue.title') : null,
  }));
  return out;
}
function safeGetFormula(s, path) {
  try { return s.chart.getFormula(path); } catch (error) { return 'throws:' + String(error.message).slice(0, 60); }
}
function tagTree(el, depth = 3) {
  if (!el) return null;
  const kids = depth > 0
    ? Array.from(el.children).slice(0, 10).map(k => tagTree(k, depth - 1))
    : [];
  return { tag: el.tagName, cls: (el.className || '').toString().split(' ').slice(0, 3).join('.'), kids: kids.length ? kids : undefined };
}

window.cs = {
  ready: () => Object.keys(LIBS),
  getChart: (kind) => sessions[kind]?.chart,
  setup(kind, opts = {}) {
    if (sessions[kind]) {
      try { sessions[kind].wb.destroy(); } catch { /* ignore */ }
      sessions[kind].host.remove();
      delete sessions[kind];
    }
    const GC = LIBS[kind];
    const host = document.createElement('div');
    host.id = 'host-' + kind;
    host.style.cssText = 'width:800px;height:560px;position:absolute;top:20px;left:' + (kind === 'official' ? 10 : 830) + 'px';
    document.getElementById('hosts').append(host);
    const wb = new GC.Spread.Sheets.Workbook(host, { sheetCount: 1 });
    const sheet = wb.getActiveSheet();
    // opts.numeric: an all-numeric 5x5 grid (no header row/column) — used by the TASK 54
    // headless-range probe; the default/stock fixtures stay untouched for every other scenario.
    const fx = opts.numeric
      ? Array.from({ length: 5 }, (_, r) => Array.from({ length: 5 }, (_, c) => (r + 1) * 100 + c + 1))
      : (FIXTURES[opts.fixture ?? 'default'] ?? FIXTURE);
    for (let r = 0; r < fx.length; r++)
      for (let c = 0; c < fx[r].length; c++) sheet.setValue(r, c, fx[r][c]);
    // opts.overrides: [[row, col, value]] applied to the fixture BEFORE charts.add
    // (TASK 54 header-detection probe).
    for (const [r, c, v] of (opts.overrides ?? [])) sheet.setValue(r, c, v);
    const chartName = opts.chartName ?? 'Chart1';
    const type = typeof opts.chartType === 'string' ? GC.Spread.Sheets.Charts.ChartType[opts.chartType] : opts.chartType;
    let chart = null;
    let creationError = null;
    if (type !== undefined && type !== null) {
      try {
        chart = sheet.charts.add(chartName, type, opts.x ?? CHART.x, opts.y ?? CHART.y,
          opts.width ?? CHART.width, opts.height ?? CHART.height, opts.range ?? DEFAULT_RANGE, opts.orientation);
      } catch (error) {
        creationError = String(error && error.message || error).slice(0, 400);
      }
    }
    sessions[kind] = { GC, wb, sheet, chart, host, chartName, creationError };
    return { ok: true, creationError };
  },
  apply,
  roundTrip(kind) {
    const s = sessions[kind];
    const json = strip(s.wb.toJSON());
    const old = s.wb;
    try { old.destroy(); } catch { /* ignore */ }
    s.wb = new s.GC.Spread.Sheets.Workbook(s.host);
    s.wb.fromJSON(json);
    s.sheet = s.wb.getActiveSheet();
    s.chart = s.sheet.charts.get(s.chartName) ?? null;
    return { chartCount: s.sheet.charts.all().length };
  },
  chartRef(kind) {
    const s = sessions[kind];
    if (!s || !s.chart) return null;
    const l = s.chart._layoutDbg;
    return { name: String(s.chart.name()), layout: l ? JSON.parse(JSON.stringify(l)) : null };
  },
  hasChart(kind) { return !!(sessions[kind] && sessions[kind].chart); },
  geom(kind) {
    const s = sessions[kind];
    const hostRect = s.host.getBoundingClientRect();
    // The chart floats relative to the sheet data area: canvas surface origin +
    // header band (40x20 in both libraries) + (x, y) * zoom.
    let origin = hostRect;
    let best = Infinity;
    for (const c of s.host.querySelectorAll('canvas')) {
      const r = c.getBoundingClientRect();
      const d = Math.abs(r.left - hostRect.left) + Math.abs(r.top - hostRect.top);
      if (r.width > 200 && d < best) { best = d; origin = r; }
    }
    const zoom = (s.wb.options && s.wb.options.zoom) || 1;
    const x = Number(s.chart.x()), y = Number(s.chart.y());
    const w = Number(s.chart.width()), h = Number(s.chart.height());
    const M = 4;
    const left = origin.left + 40 * zoom + x * zoom, top = origin.top + 20 * zoom + y * zoom;
    return { left, top, width: w * zoom, height: h * zoom, zoom,
      clip: { x: left - M, y: top - M, width: w * zoom + 2 * M, height: h * zoom + 2 * M } };
  },
  state(kind) {
    const s = sessions[kind];
    const sheetJson = strip(s.sheet.toJSON());
    return Object.assign({
      creationError: s.creationError ?? null,
      sheetCharts: sheetJson.charts ?? null,
      sheetShapes: sheetJson.shapes ?? null,
      sheetTopKeys: Object.keys(sheetJson).sort().join(','),
      chartNames: s.sheet.charts.all().map(c => String(c.name())),
    }, chartState(s));
  },
  dispose(kind) {
    if (!sessions[kind]) return;
    try { sessions[kind].wb.destroy(); } catch { /* ignore */ }
    sessions[kind].host.remove();
    delete sessions[kind];
  },
};
window.__csReady = true;
</script></body></html>
