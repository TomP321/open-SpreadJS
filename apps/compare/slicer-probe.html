<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slicer trial probe</title></head><body>
<div id="host" style="width:900px;height:620px"></div>
<script type="module">
import OfficialNs from '@mescius/spread-sheets';
import '@mescius/spread-sheets/styles/gc.spread.sheets.excel2013white.css';
import slicersUrl from '@mescius/spread-sheets-slicers/dist/gc.spread.sheets.slicers.min.js?url';
// The slicers runtime extends the shapes plugin (its declared dependency); load order:
// core (ESM) -> shapes (script) -> slicers (script). UMD attaches to window.GC.
import shapesUrl from '../../node_modules/.pnpm/@mescius+spread-sheets-slicers@19.2.5/node_modules/@mescius/spread-sheets-shapes/dist/gc.spread.sheets.shapes.min.js?url';
window.GC = OfficialNs?.Spread ? OfficialNs : window.GC;
const loadScript = src => new Promise((resolve, reject) => {
  const el = document.createElement('script');
  el.src = src;
  el.onload = resolve;
  el.onerror = () => reject(new Error(`failed to load ${src}`));
  document.head.append(el);
});
const fixFs = src => typeof src === 'string' ? src.replace(/^\/@fs(?=\/@fs\/)/, '') : src;
await loadScript(fixFs(shapesUrl));
await loadScript(fixFs(slicersUrl));
window.__probe = {
  gc: window.GC,
  hasSheetsSlicers: !!(window.GC?.Spread?.Sheets?.Slicers),
  sheetsSlicersKeys: window.GC?.Spread?.Sheets?.Slicers ? Object.keys(window.GC.Spread.Sheets.Slicers) : null,
  hasTopSlicers: !!window.GC?.Spread?.Slicers,
  topSlicersKeys: window.GC?.Spread?.Slicers ? Object.keys(window.GC.Spread.Slicers) : null,
  create() {
    const GC = window.GC;
    const wb = new GC.Spread.Sheets.Workbook(document.getElementById('host'), { sheetCount: 1 });
    const sheet = wb.getActiveSheet();
    sheet.options.rowHeaderVisible = false;
    sheet.options.colHeaderVisible = false;
    const rows = [
      ['Name', 'City', 'Salary'],
      ['Bob', 'NewYork', 80],
      ['Betty', 'NewYork', 90],
      ['Alice', 'Washington', 70],
      ['Carl', 'London', 100],
    ];
    for (let r = 0; r < rows.length; r++) for (let c = 0; c < 3; c++) sheet.setValue(r, c, rows[r][c]);
    sheet.tables.add('TableCities', 0, 0, 5, 3);
    const slicer = sheet.slicers.add('Slicer1', 'TableCities', 'City');
    return { wb, sheet, slicer };
  },
};
</script></body></html>
